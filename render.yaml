# Guardião de Cargos — Guilda da Luz
# Serviço isolado do MMORPG Os Peregrinos.
# Custo previsto: uma instância 0.5c-512mb (Starter).
previews:
  generation: off

services:
  - type: worker
    name: guilda-da-luz-guardiao-cargos
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    repo: https://github.com/gustavojesussouza13-cyber/App
    branch: discord-guardiao-cargos
    rootDir: guardiao-cargos
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        value: "1165850188825501716"
