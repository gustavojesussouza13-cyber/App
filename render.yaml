services:
  - type: web
    name: os-peregrinos-online
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peregrinos-personagens-contas
          property: connectionString
      - key: NODE_ENV
        value: production
