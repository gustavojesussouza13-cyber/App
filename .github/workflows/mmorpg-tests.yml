name: MMORPG - testes de regressão
on:
  pull_request:
    branches: [os-peregrinos-online]
  push:
    branches: [os-peregrinos-online]
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
