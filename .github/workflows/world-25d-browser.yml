name: Mundo Aberto 2.5D - navegador e WebGL
on:
  pull_request:
    branches: [os-peregrinos-online]
    paths:
      - 'public/world-25d.mjs'
      - 'public/peregrino-aurora25d.js'
      - 'public/peregrino-runway25d.js'
      - 'public/approved-classes25d.js'
      - 'public/classes-aprovadas-25d.html'
      - 'public/assets/approved-classes/**'
      - 'public/peregrino-runway-preview.html'
      - 'public/assets/peregrino/peregrino-runway-walk.png'
      - 'public/assets/peregrino/peregrino-runway-walk.json'
      - 'public/aurora-heroes25d.js'
      - 'public/heroes-master64.js'
      - 'public/peregrino-artisan64.js'
      - 'public/peregrino-atlas25d.html'
      - 'public/visual-25d.html'
      - 'public/mmo.js'
      - 'public/art16.js'
      - 'tests/world-25d-browser.mjs'
      - '.github/workflows/world-25d-browser.yml'
  workflow_dispatch:
jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e Chromium
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Iniciar servidor local do MMORPG para teste isolado
        run: |
          PORT=3106 HOST=127.0.0.1 npm start > /tmp/world25d-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3106/visual-25d.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3106/peregrino-aurora25d.js >/dev/null
          curl -fsS http://127.0.0.1:3106/aurora-heroes25d.js >/dev/null
          curl -fsS http://127.0.0.1:3106/assets/peregrino/peregrino-runway-walk.png >/dev/null
      - name: Testar preview 2.5D do commit (sem esperar deploy Render)
        env:
          WORLD25D_URL: http://127.0.0.1:3106/visual-25d.html
        run: node tests/world-25d-browser.mjs
      - name: Logs do servidor se falhar
        if: failure()
        run: cat /tmp/world25d-server.log
      - name: Guardar captura do WebGL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-aberto-25d-chromium
          path: |
            /tmp/os-peregrinos-25d-browser.png
            /tmp/os-peregrinos-peregrino-atlas.png
            /tmp/peregrino-runway-16-quadros-reais.png
            /tmp/os-peregrinos-classes-aprovadas-25d.png
            /tmp/os-peregrinos-basilisco-v4-caminhada-25d.png
            /tmp/os-peregrinos-basilisco-v4-dano-25d.png
            /tmp/os-peregrinos-basilisco-v4-acido-25d.png
            /tmp/os-peregrinos-basilisco-v4-chefe-25d.png
            /tmp/os-peregrinos-anjo-caido-v4-caminhada-25d.png
            /tmp/os-peregrinos-anjo-caido-v4-magia-25d.png
            /tmp/os-peregrinos-anjo-caido-v4-dano-25d.png
            /tmp/os-peregrinos-anjo-caido-v4-morte-25d.png
            /tmp/os-peregrinos-corvo-v4-walk-25d.png
            /tmp/os-peregrinos-corvo-v4-attack-25d.png
            /tmp/os-peregrinos-corvo-v4-hurt-25d.png
            /tmp/os-peregrinos-corvo-v4-death-25d.png
            /tmp/os-peregrinos-espinho-v4-walk-25d.png
            /tmp/os-peregrinos-espinho-v4-attack-25d.png
            /tmp/os-peregrinos-espinho-v4-hurt-25d.png
            /tmp/os-peregrinos-espinho-v4-death-25d.png
          if-no-files-found: ignore
