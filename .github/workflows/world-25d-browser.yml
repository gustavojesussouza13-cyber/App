name: Mundo Aberto 2.5D - navegador e WebGL
on:
  pull_request:
    branches: [os-peregrinos-online]
    paths:
      - 'public/world-25d.mjs'
      - 'public/visual-25d.html'
      - 'public/mmo.js'
      - 'public/art16.js'
      - 'tests/world-25d-browser.mjs'
      - '.github/workflows/world-25d-browser.yml'
  workflow_dispatch:
jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e Chromium
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Testar previsualização pública 2.5D
        run: node tests/world-25d-browser.mjs
      - name: Guardar captura do WebGL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-aberto-25d-chromium
          path: /tmp/os-peregrinos-25d-browser.png
          if-no-files-found: ignore
