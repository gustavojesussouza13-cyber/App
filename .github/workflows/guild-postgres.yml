name: Guildas - persistência real no PostgreSQL
on:
  pull_request:
    branches:
      - os-peregrinos-online
    paths:
      - 'kingdom-politics.js'
      - 'world-engine.js'
      - 'account-store.js'
      - 'server.js'
      - 'tests/guild-postgres.test.js'
      - '.github/workflows/guild-postgres.yml'
  workflow_dispatch:
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: peregrinos_test
          POSTGRES_USER: peregrinos_ci
          POSTGRES_PASSWORD: test_password_local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peregrinos_ci -d peregrinos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências sem segredos
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Persistir e restaurar cidades em PostgreSQL descartável
        env:
          TEST_POSTGRES_URL: postgres://peregrinos_ci:test_password_local_ci_only@127.0.0.1:5432/peregrinos_test
        run: node --test tests/guild-postgres.test.js
