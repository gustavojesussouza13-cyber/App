name: Importar audio medieval do Runway (uma vez)
on:
  push:
    branches:
      - feature/audio-medieval-runway-v1-20261020
    paths:
      - .github/workflows/import-runway-audio-v1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar e validar 21 arquivos MP3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, subprocess, time
          files = ["scripts/runway-audio-import-music.json",
                   "scripts/runway-audio-import-sfx1.json",
                   "scripts/runway-audio-import-sfx2.json"]
          records = sum((json.loads(pathlib.Path(p).read_text()) for p in files), [])
          assert len(records) == 21, f"Esperados 21 áudios, recebidos {len(records)}"
          destination = pathlib.Path("public/assets/audio")
          for item in records:
              name = item["file"]
              path = pathlib.PurePosixPath(name)
              assert path.parts[0] in {"music","sfx","ambience"} and len(path.parts) == 2
              assert name.endswith(".mp3") and all(part not in {".",".."} for part in path.parts)
              u = urllib.parse.urlparse(item["url"])
              assert u.scheme == "https" and u.hostname == "dnznrvs05pmza.cloudfront.net"
              target = destination / name
              target.parent.mkdir(parents=True,exist_ok=True)
              error = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(item["url"],headers={"User-Agent":"OsPeregrinosAudioImport/1.0"})
                      with urllib.request.urlopen(request, timeout=90) as response:
                          target.write_bytes(response.read())
                      break
                  except Exception as exc:
                      error = exc
                      time.sleep(2*(attempt+1))
              else: raise RuntimeError(f"Falha ao baixar {name}: {error}")
              if target.stat().st_size < 2048:
                  raise RuntimeError(f"MP3 incompleto: {name}")
              with target.open("rb") as stream:
                  header = stream.read(4)
              if not (header.startswith(b"ID3") or (header[0] == 255 and (header[1] & 224) == 224)):
                  raise RuntimeError(f"Arquivo nao parece MP3: {name}")
              print(name, target.stat().st_size,"bytes; cabeçalho MP3 OK")
          PY
      - name: Consolidar assets e excluir links temporários
        run: |
          set -euo pipefail
          git config user.name "os-peregrinos-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/audio
          git rm scripts/runway-audio-import-music.json scripts/runway-audio-import-sfx1.json scripts/runway-audio-import-sfx2.json
          git rm .github/workflows/import-runway-audio-v1.yml
          git commit -m "feat(audio): persist and validate 21 Runway medieval fantasy MP3 assets"
          git push origin HEAD:feature/audio-medieval-runway-v1-20261020
