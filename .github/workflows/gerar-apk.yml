name: Gerar APK - Gustavo O Peregrino

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Gustavo_O_Peregrino_Projeto_Android_PlayStore.zip

permissions:
  contents: read

jobs:
  apk:
    name: Compilar APK Android para testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter arquivos do repositorio
        uses: actions/checkout@v4
      - name: Extrair projeto enviado
        shell: bash
        run: |
          test -s Gustavo_O_Peregrino_Projeto_Android_PlayStore.zip
          unzip -q Gustavo_O_Peregrino_Projeto_Android_PlayStore.zip
          test -s Gustavo_O_Peregrino_Android_PlayStore/app/src/main/assets/index.html
          test -s Gustavo_O_Peregrino_Android_PlayStore/app/src/main/java/com/aurora/gustavoperegrino/MainActivity.java
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK de testes
        working-directory: Gustavo_O_Peregrino_Android_PlayStore
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Gustavo-O-Peregrino-APK
          path: Gustavo_O_Peregrino_Android_PlayStore/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
