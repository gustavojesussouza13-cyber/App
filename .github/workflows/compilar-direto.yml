name: Compilar APK diretamente do codigo

on:
  push:
    branches: [main]
    paths:
      - app/src/main/assets/index.html
      - .github/workflows/compilar-direto.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android API 36 usando SDK do runner
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verificar recursos do RPG
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/aurora/gustavoperegrino/MainActivity.java
      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gustavo-O-Peregrino-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
