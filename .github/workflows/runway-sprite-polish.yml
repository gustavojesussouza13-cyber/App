name: Polir magenta de sprites Runway (execução única)
on:
  push:
    branches: [feature/mundo-aberto-25d-webgl-preview]
    paths: ['.github/workflows/runway-sprite-polish.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install Pillow==11.3.0
      - run: python scripts/polish_runway_sprite.py
      - name: Versionar a transparência corrigida
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/peregrino/peregrino-runway-walk.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets: remove residual pink halos from Runway Peregrino sprites'
            git push origin HEAD:feature/mundo-aberto-25d-webgl-preview
          fi
