plugins { id 'com.android.application' }

android {
    namespace 'com.aurora.gustavoperegrino'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aurora.gustavoperegrino'
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName '1.4.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
